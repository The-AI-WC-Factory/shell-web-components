name: Phase 0 governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, develop, 'release/**', 'hotfix/**']
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance:
    name: ${{ github.event_name == 'pull_request' && 'governance' || 'repository-governance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate policy and Git Flow
        run: python3 .github/scripts/validate_governance.py
      - name: Test governance handoff safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-governance-${{ github.run_id }}
          path: governance-evidence.json
          if-no-files-found: error
          retention-days: 14
