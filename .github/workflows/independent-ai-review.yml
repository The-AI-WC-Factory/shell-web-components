name: Independent AI review gate
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
jobs:
  review-state-notification:
    name: review-state-notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record review-state notification
        run: echo 'Review state changed. Only the trusted App check and live merge authorization enforce approval.'
